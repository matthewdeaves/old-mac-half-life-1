// old-mac-half-life-1 - sticky runtime defaults for the whole fleet.
// The engine appends `exec userconfig.cfg` to config.cfg on every save
// (con_utils.c), so this file is re-applied on every launch and can never be
// clobbered by a config reset. Keep it renderer-safe (no per-machine paths).

// Linear texture + lightmap filtering. If these ever get archived as "1"
// (point sampling) the world renders blocky/"Minecraft"; pin them to 0.
gl_texture_nearest  "0"
gl_lightmap_nearest "0"

// Single-pass world multitexture optimisation is NOT pinned here any more.
// It was fleet-wide "1" until issue #28: confirmed on real hardware
// (imac-2019, AMD Radeon Pro 580X) to render the flashlight beam as a grid of
// grey squares instead of a light cone, and this file is re-applied every
// launch - re-pinning "1" here would silently undo the per-architecture fix
// make-app.sh's launcher profile and opengl.cfg patch now apply (PowerPC:
// on, measured to help there; everywhere else: off, measured to be broken on
// at least one real machine and never fillrate-bound enough to need it
// anyway). Do not add this cvar back here.

// Dynamic lights (the welder, muzzle flashes). r_dynamic is FCVAR_ARCHIVE and
// a benchmark probe once archived it "0" on the G3: the welder went dark and
// looked exactly like a renderer bug (#58, and the same class as the
// gl_singlepass_bmodels episode bench.sh guards against). Pin it on.
r_dynamic "1"

// Vertical sync. gl_vsync defaults on and is FCVAR_ARCHIVE; bench.sh's settle
// config turns it off for timerefresh and the engine then archives that, so a
// machine that ever ran a bench tears forever after (seen as horizontal menu
// tearing on the Lion mini's GMA 950). Pin it on; a bench's own cfg execs
// later in the session, so benchmarking still gets its uncapped run.
gl_vsync "1"

// Dlight BSP marking radius. The perf-ppc engine default is 1 (the old 3 walked
// about 27x the node volume per dlight for no extra lit surfaces), but the
// value is FCVAR_GLCONFIG and an old opengl.cfg can carry the 3 forever; pin it.
// (r_detailtextures and gl_anisotropy pins were considered here and dropped in
// review: the former disables _detail.txt content in every installed mod, the
// latter reverts a player's own console setting every launch. Both stay A/B
// knobs for the bench harness, not fleet pins.)
r_dlight_virtual_radius "1"

// Diagnostic overlays stay off. r_speeds is FCVAR_ARCHIVE, and a profiling
// probe once quit cleanly with it at "2" on the G5: every session after that
// drew renderer statistics in the corner and looked like a debug build. The
// same class of contamination as the r_dynamic and gl_vsync pins above.
r_speeds "0"

// Hide the on-screen notify area (top-left) where the engine echoes normal console
// messages (map load, renderer info, etc.) for a few seconds after each print.
// con_notifytime is the persistence time; 0 keeps gameplay clean. This is INDEPENDENT of
// developer mode -- normal Con_Printf messages notify regardless -- so it is still needed
// even though the launcher now passes -console (developer=0). The ~ console overlay still
// shows full history, so the CLI stays fully accessible.
con_notifytime "0"

// Crouch also on "c", alongside the engine's own default Ctrl bind. On macOS,
// repeatedly pressing Control (normal in a firefight - crouch is pressed and
// released constantly) can trigger the system's own "press Control key twice"
// Dictation/Voice Control shortcut, which steals focus and pops its own UI
// over the game. That is an OS-level global shortcut, not something the game
// can suppress or consume - the fix is giving players an escape hatch key
// that cannot collide with it. Reported by the user 2026-08-31, playing on
// imac-2019. Does not touch the Ctrl bind itself: it still works, and players
// unaffected by the OS shortcut (every non-macOS machine in the fleet, and
// any Mac with that Dictation shortcut off) see no change at all.
bind "c" "+duck"

// HUD icon and credits-text scale. hud_scale is FCVAR_ARCHIVE and defaults to
// "0" (disabled), which is why health/armor/ammo/flashlight icons and the
// tram-intro credits text render at their native sprite pixel size on every
// machine regardless of actual resolution (#27, reported on imac-2019 at
// 5120x2880 - well under 2% of screen height for the armor icon+number).
//
// hud_scale is a reference design width, not a multiplier: the engine treats
// the screen as that many pixels wide and scales every SPR_DrawAdditive/
// SPR_DrawHoles/SPR_Draw call and the credits-text draw path up from there
// (SPR_AdjustSize, cl_game.c) - both are the same choke point, both already
// go through ref.dllFuncs before either ref_gl or ref_soft sees them, so this
// is pure math and correct on both renderers with no renderer-specific code.
// Scaling only ever applies when the real screen is WIDER than this value
// (cl_game.c: apply_scale_factor = scale_factor > 1.0f), so 2560 leaves
// every machine in the fleet at or below 2560 wide - the G3's 800x600, every
// G4/G5, both Intel minis, and any normal HD/1440p Intel or Apple Silicon
// display - untouched at native size, exactly as shipped today. Only a
// display wider than 2560 (the reported 5120x2880 5K iMac: 2x scale) is
// affected. Needs eyes on the actual 5K iMac to confirm the icons read well
// at that 2x, and a spot check on one normal-resolution machine to confirm
// nothing moved there.
hud_scale "2560"
