// old-mac-half-life-1 - first-run key bindings for the whole fleet.
//
// The engine reads config.cfg through the searchpath and the app's read-only
// root is the LOWEST-priority path, so this file is only ever seen on a machine
// where the player has no config.cfg of their own yet. The first clean exit
// writes the player's real config.cfg beside the app, which outranks this one,
// so a rebind can never be clobbered from here.
//
// Valve's 1998 default.cfg binds movement to the arrow keys only. These are the
// later standard Half-Life bindings, WASD movement included; the arrows still
// work too.
unbindall
bind "TAB" "+showscores"
bind "ENTER" "+attack"
bind "ESCAPE" "cancelselect"
bind "SPACE" "+jump"
bind "'" "+moveup"
bind "," "+moveleft"
bind "." "+moveright"
bind "/" "+movedown"
bind "0" "slot10"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "[" "invprev"
bind "]" "invnext"
bind "`" "toggleconsole"
bind "a" "+moveleft"
bind "d" "+moveright"
bind "e" "+use"
bind "f" "impulse 100"
bind "g" "impulse 3"
bind "q" "lastinv"
bind "r" "+reload"
bind "s" "+back"
bind "t" "impulse 201"
bind "u" "messagemode2"
bind "w" "+forward"
bind "y" "messagemode"
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"
bind "ALT" "+strafe"
bind "CTRL" "+duck"
bind "SHIFT" "+speed"
bind "F5" "snapshot"
bind "F6" "save quick"
bind "F7" "load quick"
bind "PAUSE" "pause"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "MWHEELDOWN" "invnext"
bind "MWHEELUP" "invprev"
bind "PGDN" "+lookdown"
bind "PGUP" "+lookup"
bind "END" "centerview"
