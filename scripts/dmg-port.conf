# dmg-port.conf - Half-Life's settings for the shared deploy-dmg.sh and
# smoke-dmg.sh (old-mac-build-host#96). This file is ours and never synced; the
# two scripts are buildhost's and synced byte-identical. Sourced by bash.

PORT=halflife
DMG_PREFIX=Half-Life-OldMac-
IMAGE_ROOT=.
INSTALL_DIR=/Applications/Half-Life

# Everything a deploy replaces. valve/ and the mod folders beside it are the
# player's retail data, saves and installed mods, so nothing else is touched.
OWNED=(
	Half-Life.app
	"Half-Life Mods.app?"
	"Half-Life System Report.app?"
	BUILD-INFO.txt?
	README.txt?
	"Fix Launch Problems.command?"
)
VERIFY=(
	Half-Life.app/Contents/MacOS/xash3d.bin
	Half-Life.app/Contents/MacOS/xash3d
	Half-Life.app/Contents/_CodeSignature/CodeResources
)

# Releases before v1.2.0 put our game code, config and mod artwork inside the
# player's valve/, which outranks the app's read-only root, so a leftover would
# shadow the new build. Exactly those files, by name; retail data is never named.
REMOVE=(
	valve/cl_dlls/client_ppc.dylib
	valve/cl_dlls/client_amd64.dylib
	valve/dlls/hl_ppc.dylib
	valve/dlls/hl_amd64.dylib
	valve/userconfig.cfg
	valve/last-run.log
	valve/gfx/shell/mods
)

# After install: prune the directories only we ever created, while empty, and
# report (never delete) engine build spill loose at the install root, which the
# engine would load in place of the copy inside the app.
REMOTE_POST_INSTALL='rmdir valve/gfx/shell valve/gfx valve/cl_dlls valve/dlls 2>/dev/null
spill=""
for f in xash3d xash3d.bin libxash.dylib libmenu.dylib libref_gl.dylib libref_soft.dylib filesystem_stdio.dylib libSDL2-2.0.0.dylib; do
	[ -e "$f" ] && spill="$spill $f"
done
[ -z "$spill" ] || echo "WARNING: engine files loose in $DEST shadow the ones inside the app:$spill (not deleted)"
true'

# Smoke. The bundle executable is a shell launcher that picks the per-machine
# display profile and then execs xash3d.bin (docs/adr/0007), so a direct exec
# must run the launcher, and the process to watch is the engine.
PROC=xash3d.bin
SMOKE_EXEC=Half-Life.app/Contents/MacOS/xash3d
SMOKE_LOG=last-run.log
FAIL_RE='Sys_Error|EXC_|illegal instruction|Segmentation|Bus error|Abort'
SMOKE_SECS=6;          SMOKE_TIMEOUT=40
SMOKE_SECS_ppc750=14;  SMOKE_TIMEOUT_ppc750=90
SMOKE_SECS_ppc7400=10; SMOKE_TIMEOUT_ppc7400=60
SMOKE_SECS_ppc7450=10; SMOKE_TIMEOUT_ppc7450=60
SMOKE_SECS_ppc970=10;  SMOKE_TIMEOUT_ppc970=60
