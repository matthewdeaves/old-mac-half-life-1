<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="486" rx="10" fill="#f6f8fa"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#1f2328">How each machine runs the same app</text>

  <!-- row backgrounds -->
  <g>
    <rect x="16" y="112" width="948" height="46" fill="#ffffff"/>
    <rect x="16" y="158" width="948" height="46" fill="#eef2f6"/>
    <rect x="16" y="204" width="948" height="46" fill="#ffffff"/>
    <rect x="16" y="250" width="948" height="46" fill="#eef2f6"/>
    <rect x="16" y="296" width="948" height="46" fill="#ffffff"/>
    <rect x="16" y="342" width="948" height="46" fill="#eef2f6"/>
    <rect x="16" y="388" width="948" height="46" fill="#ffffff"/>
  </g>

  <!-- column headers -->
  <g>
    <rect x="170" y="60" width="192" height="50" rx="6" fill="#8250df"/>
    <rect x="366" y="60" width="192" height="50" rx="6" fill="#8250df"/>
    <rect x="562" y="60" width="192" height="50" rx="6" fill="#8250df"/>
    <rect x="758" y="60" width="206" height="50" rx="6" fill="#0a7ea4"/>
    <g fill="#ffffff" text-anchor="middle">
      <text x="266" y="82" font-size="14" font-weight="700">Power Mac G3</text>
      <text x="266" y="100" font-size="11" fill="#e9d8fd">Yosemite tower</text>
      <text x="462" y="82" font-size="14" font-weight="700">Power Mac / mini G4</text>
      <text x="462" y="100" font-size="11" fill="#e9d8fd">Quicksilver + mini</text>
      <text x="658" y="82" font-size="14" font-weight="700">iMac G5</text>
      <text x="658" y="100" font-size="11" fill="#e9d8fd">Radeon 9600</text>
      <text x="861" y="82" font-size="14" font-weight="700">Intel Mac mini</text>
      <text x="861" y="100" font-size="11" fill="#c7ecf5">Core 2 Duo</text>
    </g>
  </g>

  <!-- row labels -->
  <g font-size="12.5" font-weight="700" fill="#1f2328">
    <text x="28" y="140">CPU</text>
    <text x="28" y="186">macOS</text>
    <text x="28" y="232">Slice (dyld picks)</text>
    <text x="28" y="278">Byte order</text>
    <text x="28" y="324">SDL2</text>
    <text x="28" y="370">Renderer</text>
    <text x="28" y="416">Window</text>
  </g>

  <!-- values -->
  <g font-size="12.5" fill="#1f2328" text-anchor="middle">
    <!-- CPU -->
    <text x="266" y="140">PowerPC G3</text>
    <text x="462" y="140">PowerPC G4</text>
    <text x="658" y="140">PowerPC G5 (970)</text>
    <text x="861" y="140">Intel Core 2 Duo</text>
    <!-- macOS -->
    <text x="266" y="186">10.3-10.5</text>
    <text x="462" y="186">10.4 Tiger</text>
    <text x="658" y="186">10.5 Leopard</text>
    <text x="861" y="186">10.6.8 and up</text>
    <!-- Slice -->
    <text x="266" y="232" font-family="ui-monospace, Menlo, monospace" font-weight="700">ppc750</text>
    <text x="462" y="232" font-family="ui-monospace, Menlo, monospace" font-weight="700">ppc7400</text>
    <text x="658" y="232" font-family="ui-monospace, Menlo, monospace" font-weight="700">ppc7400</text>
    <text x="861" y="232" font-family="ui-monospace, Menlo, monospace" font-weight="700">x86_64</text>
    <!-- Byte order -->
    <text x="266" y="278">big-endian</text>
    <text x="462" y="278">big-endian</text>
    <text x="658" y="278">big-endian</text>
    <text x="861" y="278">little-endian</text>
    <!-- SDL2 -->
    <text x="266" y="324">panther-sdl2 2.0.3</text>
    <text x="462" y="324">panther-sdl2 2.0.3</text>
    <text x="658" y="324">panther-sdl2 2.0.3</text>
    <text x="861" y="324">SDL 2.0.22</text>
    <!-- Renderer -->
    <text x="266" y="370">OpenGL · Rage 128</text>
    <text x="462" y="370">OpenGL</text>
    <text x="658" y="370">OpenGL · Radeon 9600</text>
    <text x="861" y="370">OpenGL</text>
    <!-- Window -->
    <text x="266" y="416">fullscreen 800×600</text>
    <text x="462" y="416">borderless</text>
    <text x="658" y="416">borderless</text>
    <text x="861" y="416">fullscreen</text>
  </g>

  <!-- column separators -->
  <g stroke="#d0d7de" stroke-width="1">
    <line x1="162" y1="112" x2="162" y2="434"/>
    <line x1="362" y1="112" x2="362" y2="434"/>
    <line x1="558" y1="112" x2="558" y2="434"/>
    <line x1="754" y1="112" x2="754" y2="434"/>
  </g>

  <!-- legend -->
  <g>
    <rect x="16" y="452" width="14" height="14" rx="3" fill="#8250df"/>
    <text x="36" y="464" font-size="12" fill="#57606a">PowerPC (big-endian) - endian-fix forks + local patches</text>
    <rect x="520" y="452" width="14" height="14" rx="3" fill="#0a7ea4"/>
    <text x="540" y="464" font-size="12" fill="#57606a">Intel (little-endian) - FWGS mainline, 64-bit</text>
  </g>
</svg>
