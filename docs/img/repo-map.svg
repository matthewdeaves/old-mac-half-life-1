<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="600" rx="10" fill="#f6f8fa"/>
  <text x="24" y="36" font-size="21" font-weight="700" fill="#1f2328">How the repos fit together</text>

  <!-- ===== Column A: upstream ===== -->
  <rect x="16" y="58" width="222" height="372" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="16" y="58" width="222" height="30" rx="8" fill="#2d333b"/>
  <rect x="16" y="74" width="222" height="14" fill="#2d333b"/>
  <text x="30" y="78" font-size="12.5" font-weight="700" fill="#ffffff">1 · Upstream repos (public)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1f2328">
    <text x="30" y="112" font-size="10.5" font-weight="700" fill="#8250df">Upstream, branched from</text>
    <text x="30" y="132">FWGS/xash3d-fwgs</text>
    <text x="30" y="150">FWGS/mainui_cpp</text>
    <text x="30" y="168">FWGS/miniutl</text>
    <text x="30" y="186">FWGS/hlsdk-portable</text>
    <text x="30" y="204">ianlancetaylor/libbacktrace</text>
    <text x="30" y="234" font-size="10.5" font-weight="700" fill="#0a7ea4">Our forks, branch oldmac</text>
    <text x="30" y="254">the port is the commits</text>
    <text x="30" y="272">on these branches</text>
    <text x="30" y="302" font-size="10.5" font-weight="700" fill="#57606a">SDL2</text>
    <text x="30" y="322">alex-free legacy SDL2 (PPC)</text>
    <text x="30" y="340">libsdl.org 2.0.22 (Intel)</text>
    <text x="30" y="358">libsdl.org 2.32.x (arm64)</text>
  </g>
  <text x="30" y="382" font-size="10.5" fill="#57606a">Pinned to exact commits in</text>
  <text x="30" y="397" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">scripts/build-pins.sh</text>
  <text x="30" y="415" font-size="10.5" fill="#57606a">One tree per component:</text>
  <text x="30" y="427" font-size="10.5" fill="#57606a">every slice builds from it</text>

  <line x1="238" y1="244" x2="262" y2="244" stroke="#57606a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- ===== Column B: vendor ===== -->
  <rect x="262" y="58" width="196" height="372" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="262" y="58" width="196" height="30" rx="8" fill="#2d333b"/>
  <rect x="262" y="74" width="196" height="14" fill="#2d333b"/>
  <text x="276" y="78" font-size="12.5" font-weight="700" fill="#ffffff">2 · vendor/  (git-ignored)</text>
  <text x="276" y="112" font-size="11" fill="#57606a">Put at their pins by</text>
  <text x="276" y="127" font-size="11" font-family="ui-monospace, Menlo, monospace" fill="#1f2328">fetch-sources.sh</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#1f2328">
    <text x="276" y="158">xash3d-fwgs</text>
    <text x="276" y="178">hlsdk-portable</text>
    <text x="276" y="198">panther-sdl2</text>
    <text x="276" y="218">mbedtls / zlib / lzma</text>
    <text x="276" y="238" fill="#57606a">(installer only)</text>
  </g>
  <text x="276" y="272" font-size="11" fill="#57606a">Reconstructed on demand -</text>
  <text x="276" y="287" font-size="11" fill="#57606a">never committed to this repo,</text>
  <text x="276" y="302" font-size="11" fill="#57606a">no game assets, no source.</text>
  <text x="276" y="336" font-size="11" fill="#57606a">A tree is at its pin, or the</text>
  <text x="276" y="351" font-size="11" fill="#57606a">build refuses to start.</text>

  <line x1="458" y1="244" x2="482" y2="244" stroke="#57606a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- ===== Column C: build ===== -->
  <rect x="482" y="58" width="196" height="372" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="482" y="58" width="196" height="30" rx="8" fill="#2d333b"/>
  <rect x="482" y="74" width="196" height="14" fill="#2d333b"/>
  <text x="496" y="78" font-size="12.5" font-weight="700" fill="#ffffff">3 · Build (per arch)</text>
  <g font-size="11" fill="#1f2328">
    <text x="496" y="114">Check every tree is at its pin</text>
    <text x="496" y="130" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">scripts/build-all.sh</text>
    <text x="496" y="160">Compile each slice</text>
    <text x="496" y="176" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">scripts/build-*.sh (waf)</text>
    <text x="496" y="196" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">gcc-4.x (PPC) · clang (Intel, arm64)</text>
    <text x="496" y="226">Fuse the slices</text>
    <text x="496" y="242" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">make-universal.sh (lipo)</text>
    <text x="496" y="272">Wrap the bundle</text>
    <text x="496" y="288" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">make-app.sh</text>
    <text x="496" y="326">Pinned defaults and</text>
    <text x="496" y="342">first-run binds from</text>
    <text x="496" y="358" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#57606a">configs/</text>
  </g>

  <line x1="678" y1="244" x2="702" y2="244" stroke="#57606a" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- ===== Column D: ship ===== -->
  <rect x="702" y="58" width="262" height="372" rx="8" fill="#ffffff" stroke="#0a7ea4" stroke-width="1.5"/>
  <rect x="702" y="58" width="262" height="30" rx="8" fill="#0a7ea4"/>
  <rect x="702" y="74" width="262" height="14" fill="#0a7ea4"/>
  <text x="716" y="78" font-size="12.5" font-weight="700" fill="#ffffff">4 · One universal app</text>
  <text x="716" y="116" font-size="15" font-weight="700" fill="#1f2328">Half-Life.app</text>
  <text x="716" y="138" font-size="10.5" fill="#57606a">fat: ppc750 · ppc7400 · i386 · x86_64 · arm64</text>
  <text x="716" y="156" font-size="11" fill="#57606a">+ your retail valve/ data</text>
  <line x1="716" y1="172" x2="948" y2="172" stroke="#d0d7de"/>
  <g font-size="11.5" fill="#1f2328">
    <text x="716" y="196">Power Mac G3 · 10.3-10.5</text>
    <text x="716" y="221">Power Mac / mini G4 · 10.4</text>
    <text x="716" y="246">Power Mac / iMac G5 · 10.3-10.5</text>
    <text x="716" y="271">Intel 32-bit · 10.6</text>
    <text x="716" y="296">Intel 64-bit · 10.6.8+</text>
    <text x="716" y="321">Apple Silicon · macOS 11+</text>
  </g>
  <text x="716" y="356" font-size="11" fill="#57606a">Each machine loads only its</text>
  <text x="716" y="371" font-size="11" fill="#57606a">slice and self-configures the</text>
  <text x="716" y="386" font-size="11" fill="#57606a">renderer + window at launch.</text>

  <!-- ===== Driver ribbon ===== -->
  <rect x="16" y="452" width="948" height="128" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="32" y="480" font-size="15" font-weight="700" fill="#1f2328">This repo - matthewdeaves/old-mac-half-life-1</text>
  <text x="32" y="503" font-size="12" fill="#1f2328">The only thing you clone. It tracks the glue that drives all of the above - no upstream source, no game data:</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#0550ae">
    <text x="32" y="527">vendor/MANIFEST.md   scripts/fetch-sources.sh   scripts/build-pins.sh   scripts/patch-*.py</text>
    <text x="32" y="546">scripts/build-*.sh   scripts/make-universal.sh   scripts/make-app.sh   configs/   docs/</text>
  </g>
  <text x="32" y="570" font-size="12" fill="#57606a">Everything above reconstructs from a clean checkout: bootstrap clones the pinned commits, the scripts patch and build, lipo fuses the slices.</text>
</svg>
