<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="640" rx="10" fill="#f6f8fa"/>
  <text x="24" y="38" font-size="21" font-weight="700" fill="#1f2328">One app, three source trees, three CPU slices</text>

  <!-- Source trees -->
  <g>
    <rect x="16"  y="58" width="286" height="92" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="32" y="86" font-size="15" font-weight="700" fill="#1f2328">Engine</text>
    <text x="32" y="107" font-size="12.5" fill="#57606a">xash3d-fwgs</text>
[removed]
    <text x="32" y="142" font-size="11.5" fill="#57606a">big-endian · Intel: FWGS mainline</text>

    <rect x="347" y="58" width="286" height="92" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="363" y="86" font-size="15" font-weight="700" fill="#1f2328">Menu</text>
    <text x="363" y="107" font-size="12.5" fill="#57606a">mainui_cpp</text>
[removed]
    <text x="363" y="142" font-size="11.5" fill="#57606a">Intel: FWGS · built as a dylib</text>

    <rect x="678" y="58" width="286" height="92" rx="8" fill="#ffffff" stroke="#d0d7de"/>
    <text x="694" y="86" font-size="15" font-weight="700" fill="#1f2328">Game code</text>
    <text x="694" y="107" font-size="12.5" fill="#57606a">hlsdk-portable</text>
    <text x="694" y="126" font-size="11.5" fill="#57606a">client + server dylibs, per arch</text>
    <text x="694" y="142" font-size="11.5" fill="#57606a">stock Steam DLLs (x86) unusable</text>
  </g>

  <line x1="159" y1="150" x2="159" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="150" x2="490" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="821" y1="150" x2="821" y2="194" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Build bar -->
  <rect x="16" y="196" width="948" height="46" rx="8" fill="#eaeef2" stroke="#d0d7de"/>
  <text x="490" y="219" font-size="13.5" font-weight="700" fill="#1f2328" text-anchor="middle">per-arch build - waf + patch-*.py</text>
  <text x="490" y="235" font-size="11.5" fill="#57606a" text-anchor="middle">big-endian fixes · gcc-4.x shims · legacy SDL2 · OpenGL renderer</text>

  <line x1="490" y1="242" x2="490" y2="268" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Slice chips -->
  <g font-size="15" font-weight="700">
    <rect x="16"  y="270" width="306" height="74" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
    <text x="169" y="300" fill="#1f2328" text-anchor="middle">ppc750</text>
    <text x="169" y="322" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">G3, no AltiVec · 10.3-10.5 · big-endian</text>

    <rect x="337" y="270" width="306" height="74" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
    <text x="490" y="300" fill="#1f2328" text-anchor="middle">ppc7400</text>
    <text x="490" y="322" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">G4 and G5, AltiVec · 10.3-10.5 · big-endian</text>

    <rect x="658" y="270" width="306" height="74" rx="8" fill="#ffffff" stroke="#0a7ea4" stroke-width="1.5"/>
    <text x="811" y="300" fill="#1f2328" text-anchor="middle">x86_64</text>
    <text x="811" y="322" font-size="11.5" font-weight="400" fill="#57606a" text-anchor="middle">Intel · 10.7+ · little-endian</text>
  </g>

  <line x1="490" y1="344" x2="490" y2="378" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="504" y="367" font-size="12" font-style="italic" fill="#57606a">lipo - fuse the three slices into one fat Mach-O</text>

  <!-- App bundle -->
  <rect x="16" y="380" width="948" height="178" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="32" y="408" font-size="16" font-weight="700" fill="#1f2328">Half-Life.app</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#1f2328">
    <text x="34" y="436">Contents/MacOS/</text>
    <text x="60" y="458">xash3d</text><text x="300" y="458" fill="#57606a">launcher - sets OpenGL + display mode per machine</text>
    <text x="60" y="480">xash3d.bin</text><text x="300" y="480" fill="#57606a">fat: ppc750 · ppc7400 · x86_64</text>
    <text x="60" y="502">libref_gl.dylib / libref_soft.dylib</text><text x="360" y="502" fill="#57606a">fat renderers (GL + software fallback)</text>
    <text x="60" y="524">libSDL2-2.0.0.dylib</text><text x="300" y="524" fill="#57606a">x86_64 only - PPC slices link SDL statically</text>
    <text x="60" y="546">valve/</text><text x="300" y="546" fill="#57606a">your retail game data - not included in this repo</text>
  </g>

  <text x="24" y="590" font-size="12.5" fill="#57606a">At launch, dyld maps only the slice matching the CPU. Nothing to pick - one download runs on every machine.</text>
  <text x="24" y="612" font-size="12.5" fill="#57606a">Half-Life and the valve/ data are © Valve; this project ships only the tooling to run your own copy.</text>
</svg>
