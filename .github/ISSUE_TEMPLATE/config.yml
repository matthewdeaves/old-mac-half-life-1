blank_issues_enabled: true
contact_links:
  - name: Xash3D FWGS upstream
    url: https://github.com/FWGS/xash3d-fwgs
    about: >-
      Every slice here is built from our own branch of Xash3D FWGS. For
      behaviour that also happens in Xash3D on an ordinary modern machine, and
      so is not about old Macs, report it upstream rather than here.
  - name: Half-Life SDK upstream
    url: https://github.com/FWGS/hlsdk-portable
    about: >-
      The game code, and the source of every mod we rebuild. For a bug in a mod
      that is not specific to running it on an old Mac, this is the place.
