// Half-Life dedicated server configuration.
//
// This file lives in the GAME directory, as valve/server.cfg. The engine execs
// it by name once the game is up, so unlike the Quake servers it needs no
// +exec on the command line. A copy left beside the xash binary is never read.
//
// The player limit is NOT set here. It is +maxplayers on the command line,
// because the engine fixes it before this file is read.

// ---------------------------------------------------------------- identity
hostname "Half-Life"

// ----------------------------------------------------------------- privacy
//
// Two separate switches, and only one of them is the one you want.
//
// `public 0` is the listing switch. At 0 the server sends no heartbeats and
// appears in no server browser. This is the default and it is what makes the
// server private.
//
// `sv_lan` is NOT a privacy switch and must stay 0. At 1 the engine refuses
// non-class-C addresses outright (engine/server/sv_client.c), so it would not
// merely unlist the server, it would reject both of you.
public 0
sv_lan 0

// NAT bypass. Only useful for a server behind NAT that needs to punch out to
// a master. On a VPS with a real address and no listing, it does nothing.
sv_nat 0

// A joining player must supply this. Long and random.
sv_password ""

// Remote admin from inside the game, see README.md. Leave empty to disable
// rcon entirely. Note the password crosses the network in the clear, so make
// it different from sv_password and use it nowhere else.
rcon_password ""

// -------------------------------------------------------------- match rules
mp_timelimit 20
mp_fraglimit 0
mp_friendlyfire 0
mp_falldamage 0
mp_forcerespawn 1
mp_flashlight 1
mp_footsteps 1
mp_weaponstay 0
mp_teamplay 0
mp_allowmonsters 0

// ------------------------------------------------------------------ comfort
// Bandwidth ceilings, bytes/sec. The defaults are tuned for 1998 modems.
// These are generous: the constraint on a G3 is the frame rate, not the link.
sv_minrate 5000
sv_maxrate 25000

// Update rates. A G3 cannot service 100 updates a second, and asking it to
// wastes bandwidth on frames it will never draw. 60 is comfortably above what
// the oldest machine here can use and well within a modern link.
sv_minupdaterate 20
sv_maxupdaterate 60

// Seconds a silent client is kept before it is dropped. Generous on purpose:
// a vintage Mac on a slow link should survive a brief stall.
sv_timeout 120

// ------------------------------------------------------------- map rotation
// The engine reads the next map from mapcycle.txt, one name per line, which
// goes in valve/ alongside this file. Keep it to maps you have actually run
// on the oldest machine that will connect.
mapcyclefile "mapcycle.txt"
